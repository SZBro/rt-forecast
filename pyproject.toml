[project]
name = "rt-forecast"
version = "0.1.0"
description = "Predict Rotten Tomatoes scores and compare them to Kalshi market prices."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
]

# Makes `src/rt_forecast` an installable package, so `import rt_forecast`
# works from scripts, tests and the server without path hacks.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rt_forecast"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: real errors, I: sorted imports, B: common bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
