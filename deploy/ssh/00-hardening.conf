# rt-forecast: key-only SSH, no root login
# Install: /etc/ssh/sshd_config.d/00-hardening.conf
# Named 00- so it is read before 50-cloud-init.conf (sshd uses the first value it sees).
# Apply: sudo sshd -t && sudo systemctl reload ssh
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
